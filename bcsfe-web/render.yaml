# Render Blueprint: lets Render set up the site automatically from this repo.
services:
  - type: web
    name: battle-cats-editor-site-kr-28450042
    runtime: docker
    plan: free
    healthCheckPath: /
    envVars:
      - key: TRUST_PROXY
        value: "1"
      - key: MAX_CONCURRENT_JOBS
        value: "2"
      - key: COOLDOWN_SECONDS
        value: "60"
